[project]
name = "medical-care-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "maazkhanmaaz366-arch", email = "maazkhanmaaz366@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1.5.2",
    "langchain-groq>=1.2.1",
    "langgraph>=1.2.23",
    "langgraph-checkpoint-mongodb>=0.5.1",
    "motor>=3.7.1",
    "numpy>=2.5.5",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "pymongo>=4.20.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
medical-care-ai = "medical_care_ai:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
