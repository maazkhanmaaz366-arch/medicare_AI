<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediCare AI - Clinic Portal</title>
  <style>
    :root {
      --primary: #0284c7;
      --primary-hover: #0369a1;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --user-bubble: #0284c7;
      --bot-bubble: #f1f5f9;
      --border: #e2e8f0;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* --- LOGIN OVERLAY --- */
    #login-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .login-card {
      background: white;
      width: 90%;
      max-width: 440px;
      padding: 2rem;
      border-radius: 1rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .login-tabs {
      display: flex;
      border-bottom: 2px solid var(--border);
      gap: 1rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.6rem;
      border: none;
      background: none;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
    }
    .tab-btn.active {
      color: var(--primary);
      border-color: var(--primary);
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .input-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .input-group input, .input-group select {
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.95rem;
      outline: none;
    }
    .btn-submit {
      background: var(--primary);
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-submit:hover { background: var(--primary-hover); }

    /* --- CHAT HEADER & APP --- */
    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.85rem;
      font-weight: 600;
      background: #f1f5f9;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }
    .btn-logout {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fca5a5;
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-logout:hover { background: #fecaca; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .message {
      max-width: 75%;
      padding: 0.85rem 1.15rem;
      border-radius: 1rem;
      line-height: 1.5;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user-bubble);
      color: white;
      border-bottom-right-radius: 0.25rem;
    }
    .assistant {
      align-self: flex-start;
      background: var(--bot-bubble);
      color: var(--text);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }
    .status-badge {
      align-self: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      background: #e2e8f0;
      padding: 0.3rem 0.8rem;
      border-radius: 1rem;
    }
    footer {
      background: var(--card-bg);
      border-top: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      gap: 0.75rem;
    }
    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      font-size: 0.95rem;
      outline: none;
    }
    button {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 1. LOGIN OVERLAY (Shows First) -->
  <div id="login-overlay">
    <div class="login-card">
      <div style="text-align: center;">
        <h2 style="color: var(--primary);">🏥 MediCare AI Portal</h2>
        <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 0.25rem;">Authenticate to access clinical operations</p>
      </div>

      <div class="login-tabs">
        <button class="tab-btn active" id="tab-patient" onclick="switchLoginTab('patient')">🧑 Patient Check-in</button>
        <button class="tab-btn" id="tab-doctor" onclick="switchLoginTab('doctor')">🩺 Physician Portal</button>
      </div>

      <!-- Patient Form -->
      <div id="patient-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div class="input-group">
          <label>Full Legal Name</label>
          <input type="text" id="patientName" placeholder="e.g. Hamza Khan" value="Hamza Khan" />
        </div>
        <div class="input-group">
          <label>Telephone Number</label>
          <input type="text" id="patientPhone" placeholder="+1-555-0199" value="+1-555-0199" />
        </div>
        <button class="btn-submit" onclick="submitPatientLogin()">Check In & Enter Chat</button>
      </div>

      <!-- Doctor Form -->
      <div id="doctor-form" style="display: none; flex-direction: column; gap: 1rem;">
        <div class="input-group">
          <label>Attending Physician</label>
          <select id="doctorSelect">
            <option value="Dr. Emily Watson">Dr. Emily Watson (Cardiology)</option>
            <option value="Dr. Marcus Vance">Dr. Marcus Vance (Orthopedics)</option>
            <option value="Dr. Sarah Lin">Dr. Sarah Lin (Dermatology)</option>
            <option value="Dr. Robert Chen">Dr. Robert Chen (Pediatrics)</option>
            <option value="Dr. Aisha Malik">Dr. Aisha Malik (Neurology)</option>
          </select>
        </div>
        <div class="input-group">
          <label>Clinic Security PIN (Default: doc123)</label>
          <input type="password" id="doctorPin" placeholder="Enter PIN" value="doc123" />
        </div>
        <button class="btn-submit" onclick="submitDoctorLogin()">Verify Credentials</button>
      </div>
    </div>
  </div>

  <!-- 2. MAIN APPLICATION -->
  <header>
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <h2>🏥 MediCare AI</h2>
      <div class="user-badge" id="activeUserBadge">🔒 Not Logged In</div>
    </div>
    <div style="display: flex; gap: 0.5rem;">
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
  </header>

  <div id="chat-container"></div>

  <footer>
    <input type="text" id="userInput" placeholder="Type your message..." onkeypress="handleKey(event)" />
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    let socket;
    let clientId = "client_" + Date.now();
    let threadId = "thread_" + Date.now();
    let authToken = localStorage.getItem("medicare_token") || null;
    let authRole = localStorage.getItem("medicare_role") || null;
    let authName = localStorage.getItem("medicare_name") || null;
    let currentBotMsgElement = null;

    function switchLoginTab(tab) {
      if (tab === "patient") {
        document.getElementById("tab-patient").classList.add("active");
        document.getElementById("tab-doctor").classList.remove("active");
        document.getElementById("patient-form").style.display = "flex";
        document.getElementById("doctor-form").style.display = "none";
      } else {
        document.getElementById("tab-doctor").classList.add("active");
        document.getElementById("tab-patient").classList.remove("active");
        document.getElementById("doctor-form").style.display = "flex";
        document.getElementById("patient-form").style.display = "none";
      }
    }

    async function submitPatientLogin() {
      const name = document.getElementById("patientName").value.trim();
      const phone = document.getElementById("patientPhone").value.trim();
      if (!name || !phone) return alert("Please provide both your name and phone number.");

      try {
        const resp = await fetch("/auth/patient-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name, phone: phone })
        });
        const data = await resp.json();
        setAuthenticatedSession(data.access_token, data.role, data.name);
      } catch (e) {
        alert("Patient login error: " + e);
      }
    }

    async function submitDoctorLogin() {
      const doctorName = document.getElementById("doctorSelect").value;
      const pin = document.getElementById("doctorPin").value.trim();
      if (!pin) return alert("Please enter the security PIN.");

      try {
        const resp = await fetch("/auth/doctor-login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ doctor_name: doctorName, pin: pin })
        });
        if (!resp.ok) {
          const err = await resp.json();
          return alert("⛔ Login Failed: " + (err.detail || "Invalid PIN"));
        }
        const data = await resp.json();
        setAuthenticatedSession(data.access_token, data.role, data.name);
      } catch (e) {
        alert("Doctor login error: " + e);
      }
    }

    function setAuthenticatedSession(token, role, name) {
      authToken = token;
      authRole = role;
      authName = name;
      localStorage.setItem("medicare_token", token);
      localStorage.setItem("medicare_role", role);
      localStorage.setItem("medicare_name", name);

      // Hide login overlay
      document.getElementById("login-overlay").style.display = "none";

      // Update badge
      const badge = document.getElementById("activeUserBadge");
      badge.innerHTML = role === "doctor"
        ? `🩺 <b>${name}</b> (Physician)`
        : `🧑 <b>${name}</b> (Patient)`;

      // Set greeting
      const greeting = role === "doctor"
        ? `Welcome ${name}! You are authenticated as an attending physician. You can ask: "What are my appointments today?" or review patient records.`
        : `Hello ${name}! Welcome to MediCare AI. How can I help you find specialists, book consultations, or answer prep guidelines?`;

      document.getElementById("chat-container").innerHTML = `
        <div class="message assistant">${greeting}</div>
      `;

      connectWS();
    }

    function logout() {
      localStorage.clear();
      authToken = null;
      authRole = null;
      authName = null;
      document.getElementById("login-overlay").style.display = "flex";
      document.getElementById("activeUserBadge").innerText = "🔒 Not Logged In";
      document.getElementById("chat-container").innerHTML = "";
      if (socket) socket.close();
    }

    function connectWS() {
      if (socket && socket.readyState === WebSocket.OPEN) return;
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const host = window.location.host;
      socket = new WebSocket(`${protocol}//${host}/ws/clinic/${clientId}`);

      socket.onopen = () => console.log("WebSocket connected to MediCare");

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        const activeBadge = document.getElementById("active-status");
        if (activeBadge) activeBadge.remove();

        if (data.type === "status" || data.type === "tool_start") {
          const badge = document.createElement("div");
          badge.id = "active-status";
          badge.className = "status-badge";
          badge.innerText = data.message;
          document.getElementById("chat-container").appendChild(badge);
          scrollToBottom();
        } 
        else if (data.type === "chunk") {
          if (!currentBotMsgElement) {
            currentBotMsgElement = document.createElement("div");
            currentBotMsgElement.className = "message assistant";
            document.getElementById("chat-container").appendChild(currentBotMsgElement);
          }
          currentBotMsgElement.innerText += data.content;
          scrollToBottom();
        } 
        else if (data.type === "done") {
          currentBotMsgElement = null;
        } 
        else if (data.type === "error") {
          const errDiv = document.createElement("div");
          errDiv.className = "message assistant";
          errDiv.style.color = "#dc2626";
          errDiv.innerText = "⚠️ " + data.message;
          document.getElementById("chat-container").appendChild(errDiv);
          currentBotMsgElement = null;
          scrollToBottom();
        }
      };
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const text = input.value.trim();
      if (!text || !authToken) return;

      const userDiv = document.createElement("div");
      userDiv.className = "message user";
      userDiv.innerText = text;
      document.getElementById("chat-container").appendChild(userDiv);
      input.value = "";
      scrollToBottom();

      socket.send(JSON.stringify({
        message: text,
        token: authToken,
        thread_id: threadId
      }));
    }

    function handleKey(e) {
      if (e.key === "Enter") sendMessage();
    }

    function scrollToBottom() {
      const container = document.getElementById("chat-container");
      container.scrollTop = container.scrollHeight;
    }

    // Auto-login if session token saved in browser
    if (authToken && authRole && authName) {
      setAuthenticatedSession(authToken, authRole, authName);
    }
  </script>
</body>
</html>
